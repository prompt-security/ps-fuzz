[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prompt-security-fuzzer"
dynamic = ["version"]
authors = [
    {name = "Prompt Security", email = "support@prompt.security"}
]
description = "LLM and System Prompt vulnerability scanner tool"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Quality Assurance",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11"
]
dependencies = [
    "httpx>=0.27.0,<1.0.0",
    "openai>=2.45.0,<4.0.0",
    "langchain>=1.3.9,<2.0.0",
    "langchain-community>=0.4.2,<0.5.0",
    "langchain-core>=1.5.4,<2.0.0",
    "langchain-openai>=1.5.1,<2.0.0",
    "langchain-ollama>=1.1.0,<2.0.0",
    "argparse==1.4.0",
    "python-dotenv>=1.2.2,<2.0.0",
    "tqdm>=4.66.3",
    "colorama==0.4.6",
    "prettytable==3.10.0",
    "pandas==2.2.3",
    "inquirer==3.2.4",
    "prompt-toolkit==3.0.43",
    "fastparquet==2024.11.0",
    "chromadb>=1.3.5,<2.0.0",
    "langchain-chroma>=1.1.0,<2.0.0",
    "tiktoken>=0.11.0"
]

[project.optional-dependencies]
dev = ["pytest==7.4.4"]

[project.scripts]
prompt-security-fuzzer = "ps_fuzz.cli:main"

[project.urls]
Homepage = "https://github.com/prompt-security/ps-fuzz"
Repository = "https://github.com/prompt-security/ps-fuzz"

[tool.setuptools.packages.find]
include = ["ps_fuzz*"]

[tool.setuptools.package-data]
ps_fuzz = ["attack_data/*"]
